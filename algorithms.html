<script>

    const languageSwitcher =
        document.getElementById("languageSwitcher");


    function setLanguage(language) {

        /*
          Change the language attribute.
        */

        document.documentElement.lang = language;


        /*
          We only use RTL for the navigation
          and footer on this page.
        */

        if (language === "ar") {

            document.documentElement.dir = "rtl";

        } else {

            document.documentElement.dir = "ltr";

        }


        /*
          Translate all elements containing
          data-en and data-ar.
        */

        document.querySelectorAll("[data-en]").forEach(element => {

            element.textContent =
                element.getAttribute(`data-${language}`);

        });


        /*
          Keep the selected language between pages.
        */

        localStorage.setItem(
            "skewbicle-language",
            language
        );

    }


    /*
      Language dropdown changed.
    */

    languageSwitcher.addEventListener("change", function () {

        setLanguage(this.value);

    });


    /*
      Load saved language.
      English is the default.
    */

    const savedLanguage =
        localStorage.getItem("skewbicle-language") || "en";


    languageSwitcher.value = savedLanguage;

    setLanguage(savedLanguage);

</script>
