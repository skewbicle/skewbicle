<script>
    const translations = {
        en: {
            home: "Home",
            timer: "Timer",
            simulator: "Simulator",
            algorithms: "Algorithms",
            moveNotation: "Move Notation",
            lastLayer: "Last Layer",
            rights: "All rights reserved.",
            contact: "Contact Us",
            language: "العربية",
            title: "Algorithms - Skewbicle"
        },

        ar: {
            home: "الرئيسية",
            timer: "المؤقت",
            simulator: "المحاكي",
            algorithms: "الخوارزميات",
            moveNotation: "ترميز الحركات",
            lastLayer: "الطبقة الأخيرة",
            rights: "جميع الحقوق محفوظة.",
            contact: "تواصل معنا",
            language: "English",
            title: "الخوارزميات - Skewbicle"
        }
    };

    const languageToggle = document.getElementById("language-toggle");

    function setLanguage(language) {
        const lang = translations[language];

        document.documentElement.lang = language;
        document.documentElement.dir = language === "ar" ? "rtl" : "ltr";

        document.title = lang.title;

        document.querySelectorAll("[data-i18n]").forEach(element => {
            const key = element.getAttribute("data-i18n");

            if (lang[key]) {
                element.textContent = lang[key];
            }
        });

        languageToggle.textContent = lang.language;

        localStorage.setItem("skewbicle-language", language);
    }

    languageToggle.addEventListener("click", () => {
        const currentLanguage = localStorage.getItem("skewbicle-language") || "en";
        setLanguage(currentLanguage === "en" ? "ar" : "en");
    });

    // Load saved language
    const savedLanguage = localStorage.getItem("skewbicle-language") || "en";
    setLanguage(savedLanguage);
</script>
