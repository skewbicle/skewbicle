  <style>

    * {
      box-sizing: border-box;
    }

    html,
    body {

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: 'Times New Roman', Times, serif;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      height: 100%;
    }

    .mono {
      font-family: 'Times New Roman', Times, serif;
    }

    #section {
      flex: 1;
      display: flex;
      justify-content: center;
    }

    .panel {
      width: 100%;
      max-width: 860px;
      display: none;
    }

    .panel.active {
      display: block;
      animation: fade .25s ease;
    }

    @keyframes fade {
      from {
        opacity: 0;
        transform: translateY(4px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .stage-wrap {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 18px;
      margin-bottom: 18px;
    }

    .stage {
      height: 300px;
      display: flex;
      align-items: center;
      justify-content: center;
      perspective: 900px;
      touch-action: none;
      cursor: grab;
      user-select: none;
      position: relative;
    }

    .stage:active {
      cursor: grabbing;
    }

    .cube {
      position: relative;
      width: 1px;
      height: 1px;
      transform-style: preserve-3d;
      transform: rotateX(-25deg) rotateY(-60deg);
    }

    .cubie {
      position: absolute;
      top: 0;
      left: 0;
      width: 52px;
      height: 52px;
      margin: -26px 0 0 -26px;
      transform-style: preserve-3d;
    }

    .face {
      position: absolute;
      width: 52px;
      height: 52px;
      border-radius: 6px;
      box-shadow: inset 0 0 0 2px rgba(0,0,0,.55);
    }

    .face.hidden {
      background: #0c0d10;
    }

    .f-white {
      background: var(--white);
    }

    .f-yellow {
      background: var(--yellow);
    }

    .f-red {
      background: var(--red);
    }

    .f-orange {
      background: var(--orange);
    }

    .f-green {
      background: var(--green);
    }

    .f-blue {
      background: var(--blue);
    }

    .stage-controls {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 10px;
      gap: 10px;
      flex-wrap: wrap;
    }

    .hint {
      font-size: 11.5px;
      color: var(--ink-dim);
    }

    .row-btns {
      display: flex;
      gap: 8px;
    }

    button.pill {

      cursor: pointer;
      border-radius: 9px;
      border: 1px solid var(--line);
      background: var(--panel-2);
      color: var(--ink);
      font: inherit;
      font-size: 12.5px;
      font-weight: 600;
      padding: 9px 14px;
      letter-spacing: .2px;
      transition:

        color .15s,

    button.pill:hover {

    button.pill:active {

      background: var(--accent);
      color: #0b1210;

    button.pill.primary:hover {

    .movepad {

      gap: 8px;
      margin-bottom: 18px;

  <script>

    (function(){

      "use strict";


      /* =========================
         Language system
         ========================= */

      const LANGUAGE_KEY = 'skewbicle-language';

      let currentLanguage =
        localStorage.getItem(LANGUAGE_KEY) === 'ar'
          ? 'ar'
          : 'en';


      function applyLanguage(language) {

        currentLanguage =
          language === 'ar'
            ? 'ar'
            : 'en';

        /*
         * The simulator ALWAYS stays LTR.
         * Only the navigation becomes RTL.
         */

        document.documentElement.lang = currentLanguage;
        document.documentElement.dir = 'ltr';


        /*
         * Translate all elements that have
         * data-en and data-ar.
         */

        document
          .querySelectorAll('[data-en][data-ar]')
          .forEach(node => {

            node.textContent =
              node.dataset[currentLanguage];

          });


        /*
         * Translate page title.
         */

        const title =
          document.querySelector(
            'title[data-title-en][data-title-ar]'
          );

        if (title) {

          title.textContent =
            title.dataset[`title-${currentLanguage}`];

        }


        /*
         * Translate meta description.
         */

        const meta =
          document.querySelector(
            'meta[data-meta-en][data-meta-ar]'
          );

        if (meta) {

          meta.setAttribute(
            'content',
            meta.dataset[`meta-${currentLanguage}`]
          );

        }


        /*
         * Keep language selector
         * synchronized.
         */

        const switcher =
          document.getElementById(
            'languageSwitcher'
          );

        if (switcher) {
          switcher.value = currentLanguage;
        }


        localStorage.setItem(
          LANGUAGE_KEY,
          currentLanguage
        );


        /*
         * Update dynamic simulator text.
         */

        updateMeta();

      }


      const languageSwitcher =
        document.getElementById(
          'languageSwitcher'
        );


      if (languageSwitcher) {

        languageSwitcher.addEventListener(
          'change',
          e => applyLanguage(e.target.value)
        );

      }


      /* =========================
         Geometry / Math
         ========================= */

      const UNIT = 52;


      function dot(a,b){
        return a[0]*b[0] +
               a[1]*b[1] +
               a[2]*b[2];
      }


      function cross(a,b){
        return [
          a[1]*b[2]-a[2]*b[1],
          a[2]*b[0]-a[0]*b[2],
          a[0]*b[1]-a[1]*b[0]
        ];
      }


      function add(a,b){
        return [
          a[0]+b[0],
          a[1]+b[1],
          a[2]+b[2]
        ];
      }


      function scale(a,s){
        return [
          a[0]*s,
          a[1]*s,
          a[2]*s
        ];
      }


      function rnd(v){
        return v.map(
          n => Math.round(n)
        );
      }


      /*
       * Rodrigues' rotation formula
       */

      function rotateVec(
        v,
        axis,
        angleRad
      ){

        const c = Math.cos(angleRad);
        const s = Math.sin(angleRad);

        const t1 = scale(v,c);
        const t2 = scale(
          cross(axis,v),
          s
        );

        const t3 = scale(
          axis,
          dot(axis,v)*(1-c)
        );

        return add(
          add(t1,t2),
          t3
        );

      }


      const AXIS = {
        x:[1,0,0],
        y:[0,1,0],
        z:[0,0,1]
      };


      /* =========================
         Move table
         ========================= */

      const MOVES = {

        R:{
          axis:AXIS.x,
          angle:90,
          layer:c => c.pos[0]===1
        },

        "R'":{
          axis:AXIS.x,
          angle:-90,
          layer:c => c.pos[0]===1
        },

        L:{
          axis:AXIS.x,
          angle:-90,
          layer:c => c.pos[0]===-1
        },

        "L'":{
          axis:AXIS.x,
          angle:90,
          layer:c => c.pos[0]===-1
        },

        U:{
          axis:AXIS.y,
          angle:-90,
          layer:c => c.pos[1]===-1
        },

        "U'":{
          axis:AXIS.y,
          angle:90,
          layer:c => c.pos[1]===-1
        },

        D:{
          axis:AXIS.y,
          angle:90,
          layer:c => c.pos[1]===1
        },

        "D'":{
          axis:AXIS.y,
          angle:-90,
          layer:c => c.pos[1]===1
        },

        F:{
          axis:AXIS.z,
          angle:90,
          layer:c => c.pos[2]===1
        },

        "F'":{
          axis:AXIS.z,
          angle:-90,
          layer:c => c.pos[2]===1
        },

        B:{
          axis:AXIS.z,
          angle:-90,
          layer:c => c.pos[2]===-1
        },

        "B'":{
          axis:AXIS.z,
          angle:90,
          layer:c => c.pos[2]===-1
        }

      };


      const MOVE_NAMES =
        Object.keys(MOVES);


      /*
       * Fixed world-space outward directions
       */

      const NORMALS = {

        R:[1,0,0],
        L:[-1,0,0],
        U:[0,-1,0],
        D:[0,1,0],
        F:[0,0,1],
        B:[0,0,-1]

      };


      /* =========================
         Quaternion camera
         ========================= */

      let camQuat;


      function axisAngleQuat(
        axis,
        angleRad
      ){

        const s =
          Math.sin(angleRad/2);

        return [
          axis[0]*s,
          axis[1]*s,
          axis[2]*s,
          Math.cos(angleRad/2)
        ];

      }


      function quatMultiply(a,b){

        const [
          ax,ay,az,aw
        ] = a;

        const [
          bx,by,bz,bw
        ] = b;

        return [

          aw*bx +
          ax*bw +
          ay*bz -
          az*by,

          aw*by -
          ax*bz +
          ay*bw +
          az*bx,

          aw*bz +
          ax*by -
          ay*bx +
          az*bw,

          aw*bw -
          ax*bx -
          ay*by -
          az*bz

        ];

      }


      function quatNormalize(q){

        const len =
          Math.hypot(
            q[0],
            q[1],
            q[2],
            q[3]
          ) || 1;

        return [
          q[0]/len,
          q[1]/len,
          q[2]/len,
          q[3]/len
        ];

      }


      function quatRotateVec(q,v){

        const [
          qx,qy,qz,qw
        ] = q;

        const uvx =
          qy*v[2] -
          qz*v[1];

        const uvy =
          qz*v[0] -
          qx*v[2];

        const uvz =
          qx*v[1] -
          qy*v[0];

        const uuvx =
          qy*uvz -
          qz*uvy;

        const uuvy =
          qz*uvx -
          qx*uvz;

        const uuvz =
          qx*uvy -
          qy*uvx;

        return [

          v[0] +
          2*(qw*uvx+uuvx),

          v[1] +
          2*(qw*uvy+uuvy),

          v[2] +
          2*(qw*uvz+uuvz)

        ];

      }


      function quatToMatrix3d(q){

        const c1 =
          quatRotateVec(
            q,
            [1,0,0]
          );

        const c2 =
          quatRotateVec(
            q,
            [0,1,0]
          );

        const c3 =
          quatRotateVec(
            q,
            [0,0,1]
          );

        return [

          c1[0],c1[1],c1[2],0,

          c2[0],c2[1],c2[2],0,

          c3[0],c3[1],c3[2],0,

          0,0,0,1

        ];

      }


      camQuat =
        quatNormalize(
          quatMultiply(
            axisAngleQuat(
              AXIS.x,
              -25*Math.PI/180
            ),
            axisAngleQuat(
              AXIS.y,
              -60*Math.PI/180
            )
          )
        );


      function viewVector(v){

        return quatRotateVec(
          camQuat,
          v
        );

      }


      function resolveMove(label){

        const isPrime =
          label.endsWith("'");

        const base =
          isPrime
            ? label.slice(0,-1)
            : label;

        const target =
          NORMALS[base];

        let best = base;
        let bestDot = -Infinity;


        for(const key in NORMALS){

          const screenNormal =
            viewVector(
              NORMALS[key]
            );

          const d =
            dot(
              screenNormal,
              target
            );

          if(d > bestDot){

            bestDot = d;
            best = key;

          }

        }


        return best +
          (isPrime ? "'" : '');

      }


      /* =========================
         Cube state
         ========================= */

      let cubies = [];


      function buildCubies(){

        cubies = [];

        for(let x=-1;x<=1;x++)
        for(let y=-1;y<=1;y++)
        for(let z=-1;z<=1;z++){

          cubies.push({

            pos:[x,y,z],

            o:{
              ex:[1,0,0],
              ey:[0,1,0],
              ez:[0,0,1]
            }

          });

        }

      }


      const cubeEl =
        document.getElementById(
          'cube'
        );


      function stickerClass(
        axisSign,
        present
      ){

        if(!present)
          return 'hidden';

        return {

          white:'f-white',
          yellow:'f-yellow',
          red:'f-red',
          orange:'f-orange',
          green:'f-green',
          blue:'f-blue'

        }[axisSign];

      }


      function buildDom(){

        cubeEl.innerHTML = '';

        cubies.forEach(
          (c,i) => {

            const [
              x,y,z
            ] = c.pos;

            const el =
              document.createElement(
                'div'
              );

            el.className =
              'cubie';

            el.dataset.i = i;


            const faces = [

              {
                cls:stickerClass(
                  'green',
                  z===1
                ),
                tf:
                  `translateZ(${UNIT/2}px)`
              },

              {
                cls:stickerClass(
                  'blue',
                  z===-1
                ),
                tf:
                  `rotateY(180deg) translateZ(${UNIT/2}px)`
              },

              {
                cls:stickerClass(
                  'red',
                  x===1
                ),
                tf:
                  `rotateY(90deg) translateZ(${UNIT/2}px)`
              },

              {
                cls:stickerClass(
                  'orange',
                  x===-1
                ),
                tf:
                  `rotateY(-90deg) translateZ(${UNIT/2}px)`
              },

              {
                cls:stickerClass(
                  'yellow',
                  y===-1
                ),
                tf:
                  `rotateX(90deg) translateZ(${UNIT/2}px)`
              },

              {
                cls:stickerClass(
                  'white',
                  y===1
                ),
                tf:
                  `rotateX(-90deg) translateZ(${UNIT/2}px)`
              }

            ];


            faces.forEach(f => {

              const d =
                document.createElement(
                  'div'
                );

              d.className =
                'face ' + f.cls;

              d.style.transform =
                f.tf;

              el.appendChild(d);

            });


            cubeEl.appendChild(el);

          }
        );


        renderAll();

      }


      function transformFor(c){

        const [
          px,py,pz
        ] =
          c.pos.map(
            n => n*UNIT
          );

        const {
          ex,ey,ez
        } = c.o;


        const m = [

          ex[0],ex[1],ex[2],0,

          ey[0],ey[1],ey[2],0,

          ez[0],ez[1],ez[2],0,

          0,0,0,1

        ];


        return `
          translate3d(
            ${px}px,
            ${py}px,
            ${pz}px
          )
          matrix3d(
            ${m.join(',')}
          )
        `;

      }


      function renderAll(){

        const els =
          cubeEl.children;

        for(
          let i=0;
          i<cubies.length;
          i++
        ){

          els[i].style.transform =
            transformFor(
              cubies[i]
            );

        }

      }


      /* =========================
         Move execution
         ========================= */

      let history = [];
      let queue = [];
      let running = false;


      function updateMeta(){

        const moveCount =
          document.getElementById(
            'moveCount'
          );

        const stateTag =
          document.getElementById(
            'stateTag'
          );


        moveCount.textContent =
          currentLanguage === 'ar'

            ? history.length +
              (
                history.length === 1
                  ? ' حركة'
                  : ' حركات'
              )

            : history.length +
              (
                history.length === 1
                  ? ' move'
                  : ' moves'
              );


        const solved =
          history.length === 0;


        stateTag.textContent =
          solved

            ? (
                currentLanguage === 'ar'
                  ? 'تم الحل'
                  : 'Solved'
              )

            : (
                currentLanguage === 'ar'
                  ? 'مختلط'
                  : 'Scrambled'
              );


        const logEl =
          document.getElementById(
            'log'
          );


        logEl.innerHTML =
          history.length

            ? history
                .map(
                  m => `<span>${m}</span>`
                )
                .join(' ')

            : `
              <span
                class="dim"
              >
                ${
                  currentLanguage === 'ar'
                    ? 'سجل الحركات سيظهر هنا…'
                    : 'Move log will appear here…'
                }
              </span>
            `;


        logEl.scrollLeft =
          logEl.scrollWidth;

      }


      function applyDiscrete(
        sel,
        move
      ){

        const rad =
          move.angle *
          Math.PI /
          180;


        sel.forEach(c => {

          c.pos =
            rnd(
              rotateVec(
                c.pos,
                move.axis,
                rad
              )
            );


          c.o.ex =
            rnd(
              rotateVec(
                c.o.ex,
                move.axis,
                rad
              )
            );


          c.o.ey =
            rnd(
              rotateVec(
                c.o.ey,
                move.axis,
                rad
              )
            );


          c.o.ez =
            rnd(
              rotateVec(
                c.o.ez,
                move.axis,
                rad
              )
            );

        });

      }


      function animateMove(
        name,
        opts
      ){

        return new Promise(
          resolve => {

            const move =
              MOVES[name];

            const sel =
              cubies.filter(
                move.layer
              );

            const els =
              sel.map(
                c =>
                  cubeEl.children[
                    cubies.indexOf(c)
                  ]
              );


            const basePos =
              sel.map(
                c =>
                  c.pos.slice()
              );


            const baseO =
              sel.map(
                c => ({
                  ex:c.o.ex.slice(),
                  ey:c.o.ey.slice(),
                  ez:c.o.ez.slice()
                })
              );


            const duration =
              opts && opts.fast
                ? 110
                : 200;


            const targetRad =
              move.angle *
              Math.PI /
              180;


            const t0 =
              performance.now();


            function frame(t){

              let p =
                Math.min(
                  1,
                  (t-t0)/duration
                );


              const eased =
                1 -
                Math.pow(
                  1-p,
                  3
                );


              const rad =
                targetRad *
                eased;


              sel.forEach(
                (c,idx) => {

                  const pos =
                    rotateVec(
                      basePos[idx],
                      move.axis,
                      rad
                    );


                  const o = {

                    ex:
                      rotateVec(
                        baseO[idx].ex,
                        move.axis,
                        rad
                      ),

                    ey:
                      rotateVec(
                        baseO[idx].ey,
                        move.axis,
                        rad
                      ),

                    ez:
                      rotateVec(
                        baseO[idx].ez,
                        move.axis,
                        rad
                      )

                  };


                  const [
                    px,py,pz
                  ] =
                    pos.map(
                      n => n*UNIT
                    );


                  const m = [

                    o.ex[0],
                    o.ex[1],
                    o.ex[2],
                    0,

                    o.ey[0],
                    o.ey[1],
                    o.ey[2],
                    0,

                    o.ez[0],
                    o.ez[1],
                    o.ez[2],
                    0,

                    0,0,0,1

                  ];


                  els[idx].style.transform =
                    `translate3d(${px}px,${py}px,${pz}px) matrix3d(${m.join(',')})`;

                }
              );


              if(p < 1){

                requestAnimationFrame(
                  frame
                );

              } else {

                applyDiscrete(
                  sel,
                  move
                );

                renderAll();

                resolve();

              }

            }


            requestAnimationFrame(
              frame
            );

          }
        );

      }


      async function processQueue(){

        if(running)
          return;

        running = true;

        setControlsDisabled(
          true
        );


        while(queue.length){

          const job =
            queue.shift();


          await animateMove(
            job.name,
            job.opts
          );


          if(job.record)
            history.push(
              job.label ||
              job.name
            );


          if(job.unrecord)
            history.pop();


          updateMeta();

        }


        running = false;

        setControlsDisabled(
          false
        );

      }


      function setControlsDisabled(
        disabled
      ){

        document
          .querySelectorAll(
            '.movepad button, #scrambleBtn, #resetBtn'
          )
          .forEach(
            b =>
              b.disabled = disabled
          );

      }


      function queueMove(
        name,
        opts,
        label
      ){

        queue.push({

          name,
          opts,
          record:true,
          label:
            label || name

        });


        processQueue();

      }


      function handleMoveButton(
        label
      ){

        queueMove(
          resolveMove(label),
          null,
          label
        );

      }


      function scramble(){

        const seq = [];

        let lastAxis = null;


        for(
          let i=0;
          i<20;
          i++
        ){

          let name;

          do {

            name =
              MOVE_NAMES[
                Math.floor(
                  Math.random() *
                  MOVE_NAMES.length
                )
              ];

          } while(
            name[0] ===
            lastAxisLetter(
              lastAxis
            )
          );


          lastAxis = name;

          seq.push(name);

        }


        seq.forEach(
          name =>
            queue.push({
              name,
              opts:{fast:true},
              record:true
            })
        );


        processQueue();

      }


      function lastAxisLetter(
        name
      ){

        return name
          ? name[0]
          : null;

      }


      function reset(){

        queue = [];

        buildCubies();

        buildDom();

        history = [];

        updateMeta();

      }


      /* =========================
         UI wiring
         ========================= */

      function buildMovepad(){

        const pad =
          document.getElementById(
            'movepad'
          );


        [
          'U',"U'",
          'D',"D'",
          'L',"L'",
          'R',"R'",
          'F',"F'",
          'B',"B'"
        ].forEach(
          name => {

            const b =
              document.createElement(
                'button'
              );


            /*
             * Cube notation is intentionally
             * NOT translated.
             */

            b.textContent =
              name;


            b.addEventListener(
              'click',
              () =>
                handleMoveButton(
                  name
                )
            );


            pad.appendChild(b);

          }
        );

      }


      function wireTabs(){

        document
          .querySelectorAll(
            'nav.tabs button'
          )
          .forEach(
            btn => {

              btn.addEventListener(
                'click',
                () => {

                  document
                    .querySelectorAll(
                      'nav.tabs button'
                    )
                    .forEach(
                      b =>
                        b.classList.remove(
                          'active'
                        )
                    );


                  btn.classList.add(
                    'active'
                  );


                  const tab =
                    btn.dataset.tab;


                  document
                    .querySelectorAll(
                      '.panel'
                    )
                    .forEach(
                      p =>
                        p.classList.remove(
                          'active'
                        )
                    );


                  document
                    .getElementById(tab)
                    .classList.add(
                      'active'
                    );

                }
              );

            }
          );

      }


      /* =========================
         Cube dragging
         ========================= */

      function wireDrag(){

        const stage =
          document.getElementById(
            'stage'
          );

        const cube =
          document.getElementById(
            'cube'
          );


        let dragging = false;
        let lastX = 0;
        let lastY = 0;


        function apply(){

          cube.style.transform =
            `matrix3d(${quatToMatrix3d(camQuat).join(',')})`;

        }


        apply();


        function down(x,y){

          dragging = true;

          lastX = x;
          lastY = y;

        }


        function move(x,y){

          if(!dragging)
            return;


          const dx =
            x-lastX;

          const dy =
            y-lastY;


          const SENS =
            0.007;


          const rotY =
            axisAngleQuat(
              AXIS.y,
              dx*SENS
            );


          const rotX =
            axisAngleQuat(
              AXIS.x,
              -dy*SENS
            );


          const delta =
            quatMultiply(
              rotY,
              rotX
            );


          camQuat =
            quatNormalize(
              quatMultiply(
                delta,
                camQuat
              )
            );


          lastX = x;
          lastY = y;


          apply();

        }


        function up(){

          dragging = false;

        }


        stage.addEventListener(
          'mousedown',
          e =>
            down(
              e.clientX,
              e.clientY
            )
        );


        window.addEventListener(
          'mousemove',
          e =>
            move(
              e.clientX,
              e.clientY
            )
        );


        window.addEventListener(
          'mouseup',
          up
        );


        stage.addEventListener(
          'touchstart',
          e => {

            const t =
              e.touches[0];

            down(
              t.clientX,
              t.clientY
            );

          },
          {passive:true}
        );


        stage.addEventListener(
          'touchmove',
          e => {

            const t =
              e.touches[0];

            move(
              t.clientX,
              t.clientY
            );

          },
          {passive:true}
        );


        stage.addEventListener(
          'touchend',
          up
        );

      }


      /* =========================
         Buttons
         ========================= */

      document
        .getElementById('scrambleBtn')
        .addEventListener(
          'click',
          scramble
        );


      document
        .getElementById('resetBtn')
        .addEventListener(
          'click',
          reset
        );


      /* =========================
         Initialize
         ========================= */

      buildCubies();

      buildMovepad();

      buildDom();

      wireTabs();

      wireDrag();

      updateMeta();

      /*
       * Apply saved language last so
       * dynamic UI is translated too.
       */

      applyLanguage(
        currentLanguage
      );

    })();

  </script>

</body>
</html>
